[workspace]
resolver = "2"
members = [
  "crates/paradixe-domain",
  "crates/paradixe-ivv",
  "crates/paradixe-consensus",
  "crates/paradixe-routing",
  "crates/paradixe-impact",
  "crates/paradixe-api",
  "crates/paradixe-ingestor",
  "crates/paradixe-messaging",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PROPRIETARY"
authors = ["TakumiSoft <engineering@takumisoft.dev>"]

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
hmac = "0.12"
paradixe-domain = { path = "crates/paradixe-domain" }
rust_decimal = { version = "1.37", features = ["serde", "serde-with-float"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.16", features = ["v4", "serde"] }
