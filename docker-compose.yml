services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: paradixe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paradixe_soft}
      POSTGRES_USER: ${POSTGRES_USER:-paradixe_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paradixe_dev_pass}
    ports:
      - "5432:5432"
    volumes:
      - paradixe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: paradixe-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin_dev_only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - paradixe_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: paradixe-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-minioadmin} $${S3_SECRET_KEY:-minioadmin_dev_only} &&
      mc mb --ignore-existing local/$${S3_BUCKET_MEDIA:-paradixe-media} &&
      mc mb --ignore-existing local/$${S3_BUCKET_TILES:-paradixe-tiles};
      "
    restart: "no"

volumes:
  paradixe_pgdata:
  paradixe_minio:
