services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: paradixe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paradixe_soft}
      POSTGRES_USER: ${POSTGRES_USER:-paradixe_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paradixe_dev_pass}
    ports:
      - "5432:5432"
    volumes:
      - paradixe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs-init:
    image: alpine:latest
    container_name: paradixe-rustfs-init
    user: root
    command: ["sh", "-c", "chown -R 10001:10001 /data /app/logs"]
    volumes:
      - paradixe_s3_data:/data
      - paradixe_s3_logs:/app/logs
    restart: "no"

  rustfs:
    image: rustfs/rustfs:latest
    container_name: paradixe-rustfs
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin_dev_only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - paradixe_s3_data:/data
      - paradixe_s3_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  paradixe_pgdata:
  paradixe_s3_data:
  paradixe_s3_logs:
